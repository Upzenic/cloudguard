version: "3.9"

services:
  # PostgreSQL — same version as RDS in production
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB:       cloudguard
      POSTGRES_USER:     cgadmin
      POSTGRES_PASSWORD: localdev123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cgadmin -d cloudguard"]
      interval: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # FastAPI backend
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT:  staging
      AWS_REGION:   ap-south-1
      DB_HOST:      postgres
      DB_PORT:      "5432"
      DB_NAME:      cloudguard
      DB_USER:      cgadmin
      DB_PASSWORD:  localdev123
      REDIS_HOST:   redis
      # Set these from your .env file — never commit real values
      STRIPE_SECRET_KEY:     ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      RAZORPAY_KEY_ID:       ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET:   ${RAZORPAY_KEY_SECRET:-placeholder}
      TWILIO_SID:            ${TWILIO_SID:-placeholder}
      TWILIO_TOKEN:          ${TWILIO_TOKEN:-placeholder}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app       # Hot reload in dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
